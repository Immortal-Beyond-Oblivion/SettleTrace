name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: hashicorp/setup-terraform@v3
      - name: Check forbidden characters
        run: make check-no-em-dash
      - name: Vet and test
        run: make lint test
      - name: Validate Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Scan tracked files for secrets
        uses: gitleaks/gitleaks-action@v2
